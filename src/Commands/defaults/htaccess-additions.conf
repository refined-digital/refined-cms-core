# >>> refined cms defaults
# Managed block. refinedCMS:install rewrites everything between these two
# markers, so edits in here are lost on the next install — put project-specific
# rules outside them.
#
# Laravel's own .htaccess sits above this and is never touched, so framework
# updates to the rewrite rules arrive on their own.
#
# Canonical host and http -> https redirects are deliberately NOT here: they
# need the site's real domain. Put them in the mod_rewrite block above, or
# better, in the server vhost where they run before .htaccess is even read.

<IfModule mod_mime.c>
    AddType application/ld+json                     jsonld
    AddType application/manifest+json               webmanifest
    AddType image/svg+xml                           svg svgz
    AddType image/webp                              webp
    AddType image/avif                              avif
    AddType video/mp4                               mp4 m4v
    AddType video/webm                              webm
    AddType font/woff                               woff
    AddType font/woff2                              woff2
    AddType text/vtt                                vtt
</IfModule>

<IfModule mod_deflate.c>
    <IfModule mod_filter.c>
        AddOutputFilterByType DEFLATE "application/atom+xml" \
                                      "application/javascript" \
                                      "application/json" \
                                      "application/ld+json" \
                                      "application/manifest+json" \
                                      "application/rss+xml" \
                                      "application/xhtml+xml" \
                                      "application/xml" \
                                      "image/svg+xml" \
                                      "image/x-icon" \
                                      "text/css" \
                                      "text/html" \
                                      "text/javascript" \
                                      "text/plain" \
                                      "text/vtt" \
                                      "text/xml"
    </IfModule>
</IfModule>

# Brotli beats gzip by roughly 15-20% on text. Apache picks it over DEFLATE
# when the browser offers both, so leaving each in its own IfModule is safe.
<IfModule mod_brotli.c>
    <IfModule mod_filter.c>
        AddOutputFilterByType BROTLI_COMPRESS "application/javascript" \
                                              "application/json" \
                                              "application/ld+json" \
                                              "application/xml" \
                                              "image/svg+xml" \
                                              "text/css" \
                                              "text/html" \
                                              "text/javascript" \
                                              "text/plain" \
                                              "text/xml"
    </IfModule>
</IfModule>

# Nothing in here applies unless mod_headers is enabled. It is not on by
# default on Debian/Ubuntu Apache: `a2enmod headers && systemctl reload apache2`.
# The IfModule guard means a missing module fails silently rather than 500ing,
# so verify with `curl -sI <host> | grep -i strict-transport` after deploying.
<IfModule mod_headers.c>
    # `always` so these are set on error and redirect responses too, not just 2xx
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # HSTS is only honoured over https, so it is inert on a plain-http staging
    # box. includeSubDomains is left off deliberately: it is hard to walk back
    # for a year and breaks any subdomain still served over http. Add it once
    # every subdomain is confirmed https.
    Header always set Strict-Transport-Security "max-age=31536000"

    # No Content-Security-Policy here. A useful one is site-specific, and a
    # blanket policy breaks analytics, embedded video and inline handlers.
    # Start with Content-Security-Policy-Report-Only on the project.

    # Vite fingerprints these, so the filename changes whenever the content does
    <FilesMatch "\.(js|css|svg|woff2?|ttf|otf|eot)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    # Uploads keep their filename when replaced, so they get a finite ttl
    <FilesMatch "\.(jpg|jpeg|png|gif|webp|avif|ico|mp4|webm)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>
</IfModule>
# <<< refined cms defaults
