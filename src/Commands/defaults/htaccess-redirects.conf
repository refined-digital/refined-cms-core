    # >>> refined cms redirects
    # Canonical host and scheme. Commented out because they need the site's real
    # domain — uncomment one https rule and one host rule, and replace
    # example.com throughout.
    #
    # Re-running refinedCMS:install regenerates everything between these two
    # markers, so anything uncommented in here goes back to the template. Once a
    # rule is live and correct, move it just below the marker block to keep it.
    #
    # These sit above Laravel's front-controller rule on purpose. Below it the
    # ruleset re-runs with the rewritten uri, so $1 becomes "index.php" and the
    # redirect sends traffic to https://example.com/index.php.
    #
    # Better still, put these in the server vhost: mod_alias runs during
    # translate-name, before .htaccess is read at all, so a vhost-level redirect
    # costs nothing and cannot be bypassed.

    # http -> https. %{HTTPS} rather than %{SERVER_PORT} 80, which is wrong
    # behind a proxy or load balancer that terminates tls upstream
    # RewriteCond %{HTTPS} !=on
    # RewriteRule ^(.*)$ https://www.example.com/$1 [R=301,L]

    # ...if tls terminates upstream, match the forwarded header instead
    # RewriteCond %{HTTP:X-Forwarded-Proto} !https
    # RewriteRule ^(.*)$ https://www.example.com/$1 [R=301,L]

    # non-www -> www. Pick this one OR the inverse below, never both: enabling
    # each sends the browser into a redirect loop
    # RewriteCond %{HTTP_HOST} !^www\. [NC]
    # RewriteRule ^(.*)$ https://www.example.com/$1 [R=301,L]

    # ...or www -> non-www
    # RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    # RewriteRule ^(.*)$ https://%1/$1 [R=301,L]

    # Laravel already strips trailing slashes further down, so there is nothing
    # to add here for that.
    # <<< refined cms redirects
